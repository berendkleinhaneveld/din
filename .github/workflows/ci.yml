name: CI

on:
  push:
    branches: [master]
  # Any pull request, not just those targeting master, so stacked branches
  # get checked before their base merges.
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run swift-format lint
        run: swift format lint --strict --recursive --parallel Din/ Tests/

  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build

      - name: Test
        run: swift test
