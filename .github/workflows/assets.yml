name: Assets

# Regenerates the two committed images — the README screenshot and the app icon — from the app's
# own SwiftUI. Both need a Mac, so they are built here rather than by hand.

on:
  push:
    branches: ["claude/**"]
    paths:
      - "Din/**"
      - "scripts/render_readme.swift"
      - "scripts/generate_assets.sh"
      - ".github/workflows/assets.yml"

jobs:
  assets:
    name: Render
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: swift build

      - name: Build renderer
        run: |
          mkdir -p .build/render
          # Every app source except DinApp.swift, whose @main would collide with the renderer's.
          SOURCES=$(find Din -name '*.swift' ! -name 'DinApp.swift' | sort)
          swiftc -O -parse-as-library -DDEBUG \
            -target "$(uname -m)-apple-macos14.0" \
            $SOURCES scripts/render_readme.swift \
            -o .build/render/render-readme

      - name: Render
        run: .build/render/render-readme .

      - name: Build the icns
        run: ./scripts/generate_assets.sh

      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: |
            meta/Screenshot.png
            scripts/build/icon_1024.png
            Din/Assets/Din.icns

      - name: Commit assets
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/Screenshot.png Din/Assets/Din.icns
          if git diff --cached --quiet; then
            echo "assets unchanged"
            exit 0
          fi
          git commit -m "Regenerate app icon and README screenshot [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
