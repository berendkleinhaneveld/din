name: Render placeholder

# Renders ArtworkPlaceholder to PNG on a macOS runner. The app is SwiftUI, so the view cannot be
# rasterised anywhere else — this is the only way to see it without a Mac.

on:
  # Manual runs only work once this file is on the default branch — that is a GitHub
  # restriction on workflow_dispatch, not a choice.
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the PNGs back to the branch"
        type: boolean
        default: true
  # Until then, pushing the view or the renderer to a working branch runs it. The path filter
  # excludes meta/renders, so the commit this job makes cannot retrigger it.
  push:
    branches: ["claude/**"]
    paths:
      - "Din/Views/ArtworkPlaceholder.swift"
      - "Din/Views/AppIconArtwork.swift"
      - "Din/Views/WaveShape.swift"
      - "scripts/render_placeholder.swift"
      - ".github/workflows/render-placeholder.yml"

jobs:
  render:
    name: Render
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build the app
        run: swift build

      # Reported, but never worth losing the render over.
      - name: Lint
        continue-on-error: true
        run: swift format lint --strict --recursive --parallel Din/ Tests/

      - name: Build renderer
        run: |
          mkdir -p .build/render
          swiftc -O -parse-as-library \
            -target "$(uname -m)-apple-macos14.0" \
            Din/Views/WaveShape.swift \
            Din/Views/ArtworkPlaceholder.swift \
            Din/Views/AppIconArtwork.swift \
            scripts/render_placeholder.swift \
            -o .build/render/render-placeholder

      - name: Render
        run: .build/render/render-placeholder meta/renders

      - uses: actions/upload-artifact@v4
        with:
          name: placeholder-renders
          path: meta/renders/*.png

      - name: Commit renders
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.commit) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/renders
          if git diff --cached --quiet; then
            echo "renders unchanged"
            exit 0
          fi
          git commit -m "Render ArtworkPlaceholder [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
